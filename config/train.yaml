# model 
model_base: Qwen/Qwen3.5-0.8B
precision: torch.bfloat16
max_seq_length: 800
max_output_tokens: 450
quantize: False
add_regression_head: True

# LoRA 
lora: True
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
vision: True  # LoRA on vision layers
language: True # LoRA on language layers
attention: True # LoRA on attention modules
mlp: True # LoRA on mlp modules
rslora: True

#Additional Tokens
add_new_tokens: True
tokens_trainable: False
tokens_json_path : "/content/additional_tokens.json"
mean_subwords: True
untie: False

# Dataset
skip_over_length: True
add_space_btw_nums: False

# Training
run_name: Qwen3.5-0.8B_RegressionHead_DataCleaned
seed: 42
lr: 5e-5
lr_embeds: 5e-6  # If additional tokens added
batch_size: 4
gradient_accumulation: 4
warmup_steps: 25
epochs: 5
mse_lambda: 0.1
ce_lambda: 0.9